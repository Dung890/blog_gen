[project]
name = "blogagentic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.12",
    "langchain>=0.3.25",
    "langchain-community>=0.3.25",
    "langchain-core>=0.3.65",
    "langchain-groq>=1.1.3",
    "pydantic-settings>=2.9.1",
    "langgraph>=0.4.8",
    "langgraph-cli[inmem]>=0.3.1",
    "uvicorn>=0.34.3",
    "watchdog>=6.0.0",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E/W = style, F = likely bugs, I = import sorting, UP = modern syntax, B = bugbear
select = ["E", "W", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
# langchain/langgraph/groq don't ship type stubs; don't complain about them.
ignore_missing_imports = true